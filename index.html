<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pylu | clean focus pouches</title>
    
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,700&f[]=chillax@500&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #0a0a0a; /* Dark NZE aesthetic */
            color: #ffffff; 
            font-family: 'Chillax', sans-serif; 
            overflow-x: hidden;
        }

        /* Banner - Free Shipping callout like NZE */
        .promo-banner {
            background: #a8b898;
            color: #000;
            text-align: center;
            padding: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        header { padding: 40px 20px; text-align: center; }
        .logo { 
            font-family: 'Satoshi', sans-serif; font-size: 2.2rem; 
            text-transform: lowercase; color: #fff; letter-spacing: -2px;
        }

        /* HERO - Bold & Centered */
        .hero { height: 70vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .hero h1 { font-size: clamp(3rem, 10vw, 7rem); letter-spacing: -4px; line-height: 0.9; text-transform: lowercase; }
        .hero p { margin-top: 20px; color: #888; max-width: 500px; }

        /* PRODUCT GRID - Tightly packed like NZE */
        .shop-section { padding: 80px 20px; max-width: 1400px; margin: 0 auto; }
        .product-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px; 
        }

        .product-card { 
            background: #111; 
            padding: 20px; 
            border-radius: 12px; 
            text-align: left;
            transition: 0.3s;
            border: 1px solid #222;
        }
        .product-card:hover { border-color: #a8b898; }

        .image-container {
            background: #1a1a1a;
            height: 350px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Review Stars - NZE Style */
        .reviews { color: #a8b898; font-size: 0.9rem; margin-bottom: 10px; }
        
        .product-title { font-size: 1.4rem; font-weight: 500; text-transform: lowercase; margin-bottom: 5px; }
        .product-price { font-size: 1.2rem; font-weight: 700; color: #fff; margin-bottom: 15px; }

        .add-btn { 
            background: #fff; color: #000; border: none; padding: 15px; 
            width: 100%; border-radius: 6px; font-weight: 700; cursor: pointer;
            font-family: 'Chillax'; font-size: 0.9rem; text-transform: uppercase;
        }
        .add-btn:hover { background: #a8b898; }

        footer { padding: 80px; text-align: center; border-top: 1px solid #222; color: #666; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="promo-banner">Free Shipping on all orders over $50</div>

    <header>
        <div class="logo">pylu</div>
    </header>

    <section class="hero" data-aos="fade-up">
        <h1>clean focus.</h1>
        <p>caffeine & nootropics designed for everyday performance.</p>
    </section>

    <section class="shop-section">
        <div class="product-grid">
            
            <div class="product-card" data-aos="fade-up">
                <div class="image-container">
                    <img src="thai-tea.png" alt="thai tea" style="width: 80%;">
                </div>
                <div class="reviews">★★★★★ (508)</div>
                <div class="product-title">thai iced tea focus pouches</div>
                <div class="product-price">$34.99</div>
                <button class="add-btn">Add to Cart</button>
            </div>

            <div class="product-card" data-aos="fade-up" data-aos-delay="100">
                <div class="image-container">
                    <img src="matcha.png" alt="matcha" style="width: 80%;">
                </div>
                <div class="reviews">★★★★★ (396)</div>
                <div class="product-title">matcha focus pouches</div>
                <div class="product-price">$34.99</div>
                <button class="add-btn">Add to Cart</button>
            </div>

            <div class="product-card" data-aos="fade-up" data-aos-delay="200">
                <div class="image-container">
                    <img src="jasmine.png" alt="jasmine" style="width: 80%;">
                </div>
                <div class="reviews">★★★★★ (412)</div>
                <div class="product-title">jasmine milk tea pouches</div>
                <div class="product-price">$34.99</div>
                <button class="add-btn">Add to Cart</button>
            </div>

        </div>
    </section>

    <footer>
        <p>hello@pylu.com | nicotine-free | tobacco-free</p>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 800, once: true });
    </script>
</body>
</html>
