<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pylu | clean focus</title>
    
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,700&f[]=chillax@500&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #ffffff; 
            color: #000000; 
            font-family: 'Chillax', sans-serif; 
            line-height: 1.6;
            overflow-x: hidden;
        }

        header { padding: 60px 20px; text-align: center; }
        .logo { 
            font-family: 'Satoshi', sans-serif; 
            font-size: 2.5rem; 
            font-weight: 400; 
            letter-spacing: -2px; 
            text-transform: lowercase; 
        }

        .hero { height: 80vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .hero h1 { font-size: clamp(3.5rem, 10vw, 7rem); letter-spacing: -4px; line-height: 0.9; text-transform: lowercase; }

        /* STICKY SCROLL SECTION */
        /* This makes the section taller so the user "scrolls" through it */
        .sticky-wrapper {
            height: 300vh; 
            position: relative;
        }

        .sticky-container {
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .benefit-content {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            width: 100%;
            max-width: 1400px;
            padding: 0 40px;
            align-items: center;
            text-align: center;
        }

        .benefit-text {
            font-size: clamp(2.5rem, 5vw, 5rem);
            font-weight: 500;
            letter-spacing: -3px;
            line-height: 1.1;
            text-transform: lowercase;
            margin-bottom: 10px;
        }

        .benefit-sub {
            font-size: 1.2rem;
            color: #666;
            text-transform: lowercase;
        }

        .pylu-image {
            width: 100%;
            max-width: 450px;
            height: auto;
            z-index: 2;
        }

        /* SPACE FOR FLOW */
        .spacer { height: 20vh; }

        .phrase-section { padding: 150px 20px; text-align: center; background: #fafafa; }
        .phrase { font-size: clamp(2rem, 5vw, 4rem); font-weight: 500; margin: 60px 0; letter-spacing: -2px; text-transform: lowercase; }

        .product-grid { display: flex; justify-content: center; flex-wrap: wrap; gap: 40px; padding: 100px 20px; }
        .product-card { 
            background: #fff; border: 1px solid #eee; padding: 50px 40px; border-radius: 30px; width: 380px; 
            transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        .product-card:hover { border-color: #000; transform: translateY(-15px); }
        .product-card h2 { font-size: 2rem; margin: 25px 0 10px; text-transform: lowercase; }
        
        .add-btn { 
            background: #000; color: #fff; border: none; padding: 20px; width: 100%; 
            border-radius: 15px; font-weight: 500; cursor: pointer; font-size: 1.1rem;
            font-family: 'Chillax';
        }

        footer { padding: 100px 20px; text-align: center; border-top: 1px solid #eee; color: #999; }
    </style>
</head>
<body>

    <header data-aos="fade-down">
        <div class="logo">pylu</div>
    </header>

    <section class="hero" data-aos="fade-up">
        <h1>clean focus.<br>anytime.</h1>
    </section>

    <div class="sticky-wrapper">
        <div class="sticky-container">
            <div class="benefit-content">
                
                <div class="side-col">
                    <div data-aos="fade-right" data-aos-anchor-placement="center-center">
                        <div class="benefit-text">clean</div>
                        <div class="benefit-sub">sustained energy</div>
                    </div>
                    <div style="margin-top: 100px;" data-aos="fade-right" data-aos-delay="400" data-aos-anchor-placement="center-center">
                        <div class="benefit-text">no</div>
                        <div class="benefit-sub">jitters or crash</div>
                    </div>
                </div>

                <div class="center-pouch" data-aos="zoom-in" data-aos-duration="1500">
                    <img src="pylu-hero.png" alt="pylu pouch" class="pylu-image">
                </div>

                <div class="side-col">
                    <div data-aos="fade-left" data-aos-delay="200" data-aos-anchor-placement="center-center">
                        <div class="benefit-text">nicotine</div>
                        <div class="benefit-sub">free performance</div>
                    </div>
                    <div style="margin-top: 100px;" data-aos="fade-left" data-aos-delay="600" data-aos-anchor-placement="center-center">
                        <div class="benefit-text">mental</div>
                        <div class="benefit-sub">clarity & attention</div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div class="spacer"></div>

    <section class="phrase-section">
        <div class="phrase" data-aos="fade-up">"focused, not jittery."</div>
        <div class="phrase" data-aos="fade-up" data-aos-delay="200">"energy without the crash."</div>
        <div class="phrase" data-aos="fade-up" data-aos-delay="400">"clear-headed and controlled."</div>
    </section>

    <section class="product-grid">
        <div class="product-card" data-aos="fade-up">
            <div style="height:250px; background:#f9f9f9; border-radius:20px;"></div>
            <h2>thai iced tea</h2>
            <button class="add-btn">add to cart</button>
        </div>
        <div class="product-card" data-aos="fade-up" data-aos-delay="100">
            <div style="height:250px; background:#f9f9f9; border-radius:20px;"></div>
            <h2>matcha</h2>
            <button class="add-btn">add to cart</button>
        </div>
        <div class="product-card" data-aos="fade-up" data-aos-delay="200">
            <div style="height:250px; background:#f9f9f9; border-radius:20px;"></div>
            <h2>jasmine milk tea</h2>
            <button class="add-btn">add to cart</button>
        </div>
    </section>

    <footer>
        <p>hello@pylu.com</p>
        <p>nicotine-free | tobacco-free</p>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ 
            duration: 1200, 
            once: false, 
            mirror: true,
            offset: 200
        });
    </script>
</body>
</html>
