<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pylu | clean focus</title>
    
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,700&f[]=chillax@500&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #fff; color: #000; font-family: 'Chillax', sans-serif; overflow-x: hidden; }
        
        /* Logo: all undercased [cite: 10] */
        header { padding: 60px 20px; text-align: center; }
        .logo { font-family: 'Satoshi', sans-serif; font-size: 2.5rem; text-transform: lowercase; letter-spacing: -2px; }

        .hero { height: 60vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 20px; }
        .hero h1 { font-size: clamp(3rem, 8vw, 6rem); text-transform: lowercase; letter-spacing: -3px; line-height: 1; }

        /* Benefits: Video-inspired split layout [cite: 29-48] */
        .benefit-section { display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: center; padding: 100px 20px; max-width: 1200px; margin: 0 auto; text-align: center; }
        .benefit-title { font-size: clamp(2rem, 4vw, 4rem); font-weight: 500; letter-spacing: -2px; }
        .benefit-desc { color: #666; font-size: 1rem; margin-top: 5px; }

        .pylu-image { width: 100%; max-width: 400px; height: auto; }

        .product-grid { display: flex; justify-content: center; gap: 30px; padding: 100px 20px; flex-wrap: wrap; }
        .product-card { border: 1px solid #eee; padding: 40px; border-radius: 24px; width: 340px; transition: 0.4s; text-align: center; }
        .product-card:hover { border-color: #000; transform: translateY(-10px); }
        .product-card h2 { text-transform: lowercase; font-size: 1.8rem; margin: 20px 0 10px; }
    </style>
</head>
<body>

    <header data-aos="fade-down">
        <div class="logo">pylu</div>
    </header>

    <section class="hero" data-aos="fade-up">
        <h1>clean focus.<br>anytime.</h1>
    </section>

    <div class="benefit-section">
        <div data-aos="fade-right">
            <div class="benefit-title">clean</div>
            <div class="benefit-desc">sustained energy [cite: 33]</div>
        </div>
        <div data-aos="zoom-in">
            <img src="pylu-hero.png" class="pylu-image" alt="pylu container">
        </div>
        <div data-aos="fade-left">
            <div class="benefit-title">nicotine</div>
            <div class="benefit-desc">free performance [cite: 36]</div>
        </div>
    </div>

    <section class="product-grid">
        <div class="product-card" data-aos="fade-up">
            <img src="thai-tea.png" style="width:100%">
            <h2>thai iced tea</h2>
            <button style="background:#000; color:#fff; width:100%; padding:15px; border-radius:12px; margin-top:20px; cursor:pointer; font-family:'Chillax';">add to cart</button>
        </div>
        </section>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1000, once: false, mirror: true });
    </script>
</body>
</html>
